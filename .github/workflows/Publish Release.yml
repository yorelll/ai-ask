name: Publish Release

on:
  # Manual dispatch derives the release tag from plugin.json.
  workflow_dispatch:
  # Creating a matching version tag explicitly publishes that exact version.
  push:
    tags: [ "v*" ]

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify icon file exists (Flow needs it for the plugin tile)
        shell: pwsh
        run: |
          if (-not (Test-Path "Images\plugin.png")) {
            Write-Error "Missing Images/plugin.png - Flow Launcher requires an icon."
            exit 1
          }

      - name: Get version from plugin.json
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content plugin.json -Raw | ConvertFrom-Json).Version
          echo "version=$v" | Out-File -Encoding ascii -FilePath $env:GITHUB_OUTPUT
          echo "tag=v$v" | Out-File -Encoding ascii -Append -FilePath $env:GITHUB_OUTPUT

      - name: Install dependencies into lib/
        run: |
          python -m pip install --upgrade pip
          pip install -r ./requirements.txt -t ./lib

      - name: Sanity check - plugin imports from bundled lib
        shell: pwsh
        run: |
          # Simulate the Python_v2 sys.path bootstrap (plugin-dir + lib) and
          # verify main.py imports cleanly from ./lib alone.
          $code = @'
          import sys
          sys.path.insert(0, ".")
          sys.path.insert(0, "./lib")
          import main
          print("IMPORT OK")
          '@
          python -c $code

      - name: Package plugin zip
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force lib\__pycache__ -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force lib\bin -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Filter __pycache__ -Directory | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Filter *.pyc | Remove-Item -Force -ErrorAction SilentlyContinue
          $include = @(
            "plugin.json",
            "SettingsTemplate.yaml",
            "main.py",
            "requirements.txt",
            "README.md",
            "Images",
            "lib"
          )
          foreach ($path in $include) {
            if (-not (Test-Path $path)) {
              Write-Error "Required release path is missing: $path"
              exit 1
            }
          }
          Compress-Archive -Path $include -DestinationPath "AIAsk-${{ steps.version.outputs.version }}.zip" -Force
          Get-ChildItem -Filter "*.zip" | Select-Object Name,Length

      - name: Verify pushed release tag matches plugin.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v${{ steps.version.outputs.version }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match plugin.json version v${{ steps.version.outputs.version }}."
            exit 1
          }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "AIAsk-${{ steps.version.outputs.version }}.zip"
          name: "AI Ask v${{ steps.version.outputs.version }}"
          # For tag pushes this must already exist and was verified above.
          # For manual dispatch action-gh-release creates this version tag.
          tag_name: "v${{ steps.version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          body: |
            AI Ask - Flow Launcher plugin (Python_v2, streaming).

            - Requires **64-bit CPython 3.11.x**; Flow's embedded Python 3.11.4 is supported.
            - Download the zip, extract into `%APPDATA%\FlowLauncher\Plugins\AIAsk\`,
              reload plugins, then configure in Settings (base_url / api_key / model /
              max_tokens / skills).
            - Dependencies are bundled in `lib/`, nothing to pip install.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
