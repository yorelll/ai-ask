name: Publish Native C# Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the GitHub release (normally publish from a matching csharp-v* tag)"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "csharp-v*"

jobs:
  publish-native-csharp:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Read native manifest version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content "src/AIAsk.Plugin/plugin.json" -Raw | ConvertFrom-Json
          if ($manifest.Language -ne "csharp") {
            Write-Error "Native release requires Language=csharp."
            exit 1
          }
          $version = $manifest.Version
          if ($version -notmatch '^\d+\.\d+\.\d+([-.+].+)?$') {
            Write-Error "Manifest version '$version' is not a supported semantic version."
            exit 1
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii
          "tag=csharp-v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Verify pushed tag matches native manifest version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "${{ steps.version.outputs.tag }}") {
            Write-Error "Tag '${{ github.ref_name }}' must equal '${{ steps.version.outputs.tag }}'."
            exit 1
          }

      - name: Restore
        run: dotnet restore AIAsk.CSharp.sln

      - name: Build and test
        run: |
          dotnet build AIAsk.CSharp.sln --configuration Release --no-restore
          dotnet test AIAsk.CSharp.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Stage native C# plugin
        id: stage
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "AIAsk.Native.CSharp"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null

          $output = "src/AIAsk.Plugin/bin/Release/net9.0-windows10.0.19041.0"
          if (-not (Test-Path $output)) {
            Write-Error "Expected build output directory '$output' was not found."
            exit 1
          }

          Copy-Item "$output/*" $stage -Recurse -Force
          Copy-Item "src/AIAsk.Plugin/plugin.json" (Join-Path $stage "plugin.json") -Force
          Copy-Item "Images" (Join-Path $stage "Images") -Recurse -Force

          "stage=$stage" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Verify native C# artifact staging
        shell: pwsh
        run: |
          ./scripts/verify-csharp-release.ps1 `
            -StageDirectory "${{ steps.stage.outputs.stage }}" `
            -ExpectedVersion "${{ steps.version.outputs.version }}"

      - name: Package native C# plugin
        id: package
        shell: pwsh
        run: |
          $archive = "AIAsk.Native.CSharp-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "${{ steps.stage.outputs.stage }}\*" -DestinationPath $archive -Force
          "archive=$archive" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii
          Get-Item $archive | Select-Object Name,Length

      - name: Publish native C# release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AI Ask Native C# v${{ steps.version.outputs.version }}
          files: ${{ steps.package.outputs.archive }}
          body: |
            Native C# edition of AI Ask for Flow Launcher.

            This release is intentionally separate from the Python `v0.0.1` line.
            Install the archive contents as a Flow plugin directory. It contains a
            native C# DLL and managed dependencies; it does not require Python.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
