body:
  - type: input
    attributes:
      name: base_url
      label: Base URL
      description: "The OpenAI-compatible API endpoint, e.g. https://devops.realtek.com/realgpt-api/openai-compatible/v1"
      defaultValue: ""
  - type: passwordBox
    attributes:
      name: api_key
      label: API Key
      description: "Your API key for the endpoint above."
      defaultValue: ""
  - type: input
    attributes:
      name: model
      label: Model
      description: "The model name to use, e.g. fast, gpt-4o."
      defaultValue: "fast"
  - type: input
    attributes:
      name: max_tokens
      label: Max Token
      description: "Maximum number of tokens in the model response. Default 1000."
      defaultValue: "1000"
  - type: input
    attributes:
      name: timeout
      label: Timeout (seconds)
      description: "Per-request timeout in seconds. Default 60."
      defaultValue: "60"
  - type: textBlock
    attributes:
      description: "Skills are managed dynamically. Use `ai /skills` for Flow command management, or `ai /skills-ui` for the visual table. Enabled global skills are combined as the system prompt; `ai /add` loads optional skills for one request only."
